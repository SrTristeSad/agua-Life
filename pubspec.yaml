name: agua_life
description: Faithful J2ME aquarium tycoon remake built with Flutter and Flame.
publish_to: "none"
version: 0.7.0+7

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.38.2
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/art/
    - assets/images/pixel/
