name: Restaurar matriz original em 4K
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refine_original_matrix.py'
      - '.github/workflows/refine-original-matrix.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install pillow
      - name: Generate faithful 4K original matrix
        run: python scripts/refine_original_matrix.py
      - name: Confirm no invalid dimensions
        run: |
          python - <<'PY'
          from PIL import Image
          import json
          p='assets/fish/matrix/atlas_original_refined_4k.png'
          with Image.open(p) as im: assert im.size==(4032,2220) and im.mode=='RGBA'
          d=json.load(open('assets/fish/matrix/atlas_original_refined_4k.json'))
          assert len(d['bounds'])==21 and all(len(row)==21 for row in d['bounds'])
          PY
      - name: Commit original-art enhancement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/fish/matrix/atlas_original_refined_4k.png assets/fish/matrix/atlas_original_refined_4k.json
          if ! git diff --cached --quiet; then
            git commit -m 'assets: incluir matriz original aprimorada 4K sem redesenho'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
