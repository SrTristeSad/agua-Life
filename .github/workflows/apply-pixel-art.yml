name: Apply Pixel Art

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/pixel/**'
      - 'lib/pixel_landing.dart'
      - 'tools/apply_pixel_art.py'
      - '.github/workflows/apply-pixel-art.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Materialize pixel-art runtime assets
        run: python3 tools/apply_pixel_art.py

      - name: Verify generated files
        run: |
          test -s assets/images/pixel/menu_atlas.png
          test -s assets/images/pixel/fish_swim_a.png
          test -s assets/images/pixel/fish_swim_b.png
          git diff --check

      - name: Commit integrated pixel-art runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml lib/main.dart lib/game/components/fish_component.dart lib/pixel_landing.dart assets/images/pixel assets/pixel
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "feat: integrate pixel-art splash and animated fish"
          git push
