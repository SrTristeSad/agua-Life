name: Lua tests
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua and native LÖVE renderer
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4 love xvfb python3-pil
      - name: Lua syntax check
        run: find . -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Existing catalogs, genetics and modular rig
        run: |
          lua5.4 tests/catalog.lua
          lua5.4 tests/render_smoke.lua
          lua5.4 tests/genetics.lua
          lua5.4 tests/rigged_fish.lua
          lua5.4 tests/game_play.lua
          lua5.4 tests/matrix.lua
          lua5.4 tests/dna_visual.lua
      - name: Validate generated transparent sprites and joint metadata
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,struct
          root=Path('assets/fish/azul_rubi')
          d=json.loads((root/'rig.json').read_text(encoding='utf-8'))
          assert d['canvas']==[320,180] and d['png']==[640,360]
          layers=['body','tail','dorsal','pelvic','pectoral','eye']
          layers.extend('pattern_'+str(i) for i in range(1,7))
          for name in layers:
            raw=(root/(name+'.png')).read_bytes()
            assert raw[:8]==b'\x89PNG\r\n\x1a\n',name
            assert struct.unpack('>II',raw[16:24])==(640,360),name
            assert raw[25] in (4,6),name+' has no alpha channel'
            assert (root/(name+'.svg')).is_file(),name
          assert (root/'swim.gif').is_file()
          print('OK 12 camadas RGBA + prancheta + GIF')
          PY
      - name: Validate user fish atlas dimensions and transparency
        run: |
          python - <<'PY'
          from pathlib import Path
          import struct,json
          root=Path('assets/fish/matrix')
          pic=root/'atlas_441.png'
          d=pic.read_bytes()
          assert d[:8]==bytes((137,80,78,71,13,10,26,10))
          assert struct.unpack('>II',d[16:24])==(2688,1480)
          assert d[25] in (4,6)
          meta=json.loads((root/'atlas_441.json').read_text(encoding='utf-8'))
          assert meta['grid']==[21,21] and meta['cell']==[128,64]
          assert len(meta['bounds'])==21
          assert all(len(row)==21 for row in meta['bounds'])
          assert len(meta['magic_pairs'])==7
          print('OK 441 tiles RGBA, 7 magic fish and JSON metadata')
          PY
      - name: Verify original fish matrix 4K
        run: |
          python - <<'PY'
          from PIL import Image
          import json
          from pathlib import Path
          original=Image.open('assets/fish/matrix/atlas_441.png')
          refined=Image.open('assets/fish/matrix/atlas_original_refined_4k.png')
          assert original.size==(2688,1480)
          assert refined.size==(4032,2220) and refined.mode=='RGBA'
          info=json.loads(Path('assets/fish/matrix/atlas_original_refined_4k.json').read_text())
          assert info['grid']==[21,21] and info['cell']==[192,96]
          assert len(info['bounds'])==21 and all(len(row)==21 for row in info['bounds'])
          assert len(info['magic_bounds'])==7 and info['no_redraw'] is True
          source=Path('main.lua').read_text(encoding='utf-8')
          assert 'art.hd_matrix' not in source
          assert 'art.matrix' in source
          print('OK: matriz original recuperada; sem desenhos vetoriais rejeitados')
          PY
      - name: Verify clean fish matrix integrity
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import json
          root=Path('assets/fish/matrix')
          meta=json.loads((root/'atlas_original_clean_4k.json').read_text(encoding='utf-8'))
          audit=json.loads((root/'atlas_original_clean_4k.audit.json').read_text(encoding='utf-8'))
          assert meta['no_redraw'] is True and len(audit)==441
          assert meta['grid']==[21,21] and meta['cell']==[192,96]
          assert min(item['pixels'] for item in audit)>100
          with Image.open(root/'atlas_original_clean_4k.png') as atlas:
            assert atlas.size==(4032,2220) and atlas.mode=='RGBA'
            for row in range(21):
              for fin in range(21):
                b=atlas.crop((fin*192,row*96,(fin+1)*192,(row+1)*96)).getbbox()
                assert b and b[0]>=12 and b[1]>=7 and b[2]<=180 and b[3]<=89,(row,fin,b)
          print('OK 441 separate normalized fish, 7 magic fish')
          PY
      - name: Native GPU render smoke
        env:
          AGUA_RIG_SMOKE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 50s xvfb-run -a love .
      - name: Native clean original matrix smoke
        env:
          AGUA_CLEAN_SMOKE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 50s xvfb-run -a love .
      - name: Native matrix-animation smoke
        env:
          AGUA_MATRIX_SMOKE: '1'
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 50s xvfb-run -a love .
      - name: Native playable menu and aquarium smoke
        env:
          AGUA_PLAY_SMOKE: aquarium
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 50s xvfb-run -a love .
      - name: Native 21x21 DNA catalog rendering smoke
        env:
          AGUA_PLAY_SMOKE: collection
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: timeout 50s xvfb-run -a love .
      - name: Build standalone LOVE game (without study-only original assets)
        run: zip -qr agua-Life-playable.love main.lua conf.lua art/catalog.lua art/dna_visual.lua art/fish.lua art/matrix.lua art/rigged_fish.lua genetics game assets/fish/azul_rubi assets/fish/matrix/atlas_441.png assets/fish/matrix/atlas_441.json assets/fish/matrix/atlas_original_clean_4k.png assets/fish/matrix/atlas_original_clean_4k.json
      - name: Verify packaged game uses corrected atlas
        run: |
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('agua-Life-playable.love') as package:
            names=set(package.namelist())
            assert 'assets/fish/matrix/atlas_original_clean_4k.png' in names
            assert 'assets/fish/matrix/atlas_original_clean_4k.json' in names
            assert 'art/hd_matrix.lua' not in names
            assert not any(x.startswith('assets/fish/hd/') for x in names)
            assert "local CLEAN='assets/fish/matrix/atlas_original_clean_4k.png'" in package.read('art/matrix.lua').decode()
            print('OK: game contains CLEAN matrix; vector experiments excluded.')
          PY
      - name: Publish playable LOVE file
        uses: actions/upload-artifact@v4
        with:
          name: agua-Life-playable
          path: agua-Life-playable.love
          if-no-files-found: error
          retention-days: 30
      - name: Build Windows test bundle
        run: |
          mkdir -p dist/agua-Life
          cp agua-Life-playable.love INICIAR_WINDOWS.bat dist/agua-Life/
          cp README.md dist/agua-Life/LEIA-ME.md
          cd dist
          zip -qr ../agua-Life-Windows-matriz.zip agua-Life
      - name: Publish Windows game ZIP
        uses: actions/upload-artifact@v4
        with:
          name: agua-Life-Windows-Recorte-Corrigido
          path: agua-Life-Windows-matriz.zip
          if-no-files-found: error
          retention-days: 30
