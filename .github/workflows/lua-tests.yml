name: Lua tests
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update -qq && sudo apt-get install -y lua5.4
      - name: Lua syntax check
        run: find . -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Catalog and rendering tests
        run: lua5.4 tests/catalog.lua && lua5.4 tests/render_smoke.lua
